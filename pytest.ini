[pytest]
addopts = --screenshot=on --video=retain-on-failure
testpaths = tests
markers =
    web: marks tests as web ui tests
    api: marks tests as api tests
    smoke: marks tests as smoke tests (critical path)
    critical: marks tests as critical functionality
    business_a: marks tests for Business A (Enterprise Analysis)
    business_b: marks tests for Business B
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_date_format = %Y-%m-%d %H:%M:%S
